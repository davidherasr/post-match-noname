# Copia como .streamlit/secrets.toml o pega en Streamlit Cloud > Settings > Secrets.
# Para Streamlit Cloud usa preferentemente la cadena "Session pooler" de Supabase → Database → Connect.
# No uses literalmente PROJECT_REF/PASSWORD/REGION.
DATABASE_URL = "postgresql://postgres.PROJECT_REF:PASSWORD@aws-0-REGION.pooler.supabase.com:5432/postgres"
DEMO_MODE = false
RUN_MIGRATIONS = true
REQUIRE_REPORT_APPROVAL = false

BOOTSTRAP_ADMIN_NAME = "Administrador"
BOOTSTRAP_ADMIN_EMAIL = "admin@tuclub.com"
BOOTSTRAP_ADMIN_PASSWORD = "CAMBIA-POR-UNA-CONTRASENA-FUERTE-Y-UNICA"

LOGIN_MAX_ATTEMPTS = 5
LOGIN_LOCK_MINUTES = 15

# Opcional: almacenamiento privado y persistente de PDF.
SUPABASE_URL = "https://PROJECT_REF.supabase.co"
SUPABASE_SERVICE_ROLE_KEY = "SERVICE_ROLE_KEY"
SUPABASE_BUCKET = "postmatch-reports"

# No Name · Área Técnica no inserta datos deportivos ficticios.
