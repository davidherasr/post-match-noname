[theme]
base = "light"
primaryColor = "#A0443A"
backgroundColor = "#F5F6F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#243A32"
font = "sans serif"

[server]
maxUploadSize = 50
headless = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
